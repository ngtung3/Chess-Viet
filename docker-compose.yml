services:
  # Frontend
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/
    networks:
      - chess-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/nginx/conf:/etc/nginx/conf.d
      - ./api-gateway/nginx/html:/usr/share/nginx/html
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_started
      matchmaking-service:
        condition: service_started
      game-session-service:
        condition: service_started
      move-validation-service:
        condition: service_started
      websocket-service:
        condition: service_started
      notification-service:
        condition: service_started
      chat-service:
        condition: service_started
      replay-service:
        condition: service_started
      ai-bot-service:
        condition: service_started
    networks:
      - chess-network

  # Services
  auth-service:
    build: ./auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=chess_auth
      - DB_USER=chess_user
      - DB_PASSWORD=chess_password
      - JWT_SECRET=dev-secret-change-me
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chess-network

  matchmaking-service:
    build: ./matchmaking-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=chess_matchmaking
      - DB_USER=chess_user
      - DB_PASSWORD=chess_password
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chess-network

  game-session-service:
    build: ./game-session-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=chess_games
      - DB_USER=chess_user
      - DB_PASSWORD=chess_password
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chess-network

  move-validation-service:
    build: ./move-validation-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      kafka:
        condition: service_started
    networks:
      - chess-network

  websocket-service:
    build: ./websocket-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chess-network

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - chess-network

  chat-service:
    build: ./chat-service
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=chess_chat
      - DB_USER=chess_user
      - DB_PASSWORD=chess_password
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chess-network

  replay-service:
    build: ./replay-service
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=chess_games
      - DB_USER=chess_user
      - DB_PASSWORD=chess_password
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chess-network

  ai-bot-service:
    build: ./ai-bot-service
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - chess-network

  # Databases
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: chess_user
      MYSQL_PASSWORD: chess_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - chess-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - chess-network

  # Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chess-network

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - ./kafka/config/server.properties:/etc/kafka/server.properties
    networks:
      - chess-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - chess-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - chess-network
  # Connect các service khác ...
  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   ports:
  #     - "16686:16686"
  #     - "14268:14268"
  #   environment:
  #     - COLLECTOR_ZIPKIN_HOST_PORT=:9411
  #   networks:
  #     - chess-network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  chess-network:
    driver: bridge
