# Docker DNS: nginx tu phan giai lai ten service (khong con 502 do IP cu sau khi container khoi dong lai)
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  server_name _;

  proxy_connect_timeout 5s;

  location /api/auth/ {
    set $up http://auth-service:3001;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location /api/matchmaking/ {
    set $up http://matchmaking-service:3002;
    rewrite ^/api/matchmaking/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location = /api/games/health {
    set $up http://game-session-service:3003;
    rewrite ^ /health break;
    proxy_pass $up;
  }

  location = /api/games {
    set $up http://game-session-service:3003;
    rewrite ^ /games break;
    proxy_pass $up;
  }

  location /api/games/ {
    set $up http://game-session-service:3003;
    rewrite ^/api/games/(.*)$ /games/$1 break;
    proxy_pass $up;
  }

  location /api/validate/ {
    set $up http://move-validation-service:3004;
    rewrite ^/api/validate/(.*)$ /validate/$1 break;
    proxy_pass $up;
  }

  location /api/notifications/ {
    set $up http://notification-service:3007;
    rewrite ^/api/notifications/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location /api/chat/ {
    set $up http://chat-service:3009;
    rewrite ^/api/chat/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location /api/replay/ {
    set $up http://replay-service:3010;
    rewrite ^/api/replay/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location /api/ai/ {
    set $up http://ai-bot-service:3011;
    rewrite ^/api/ai/(.*)$ /$1 break;
    proxy_pass $up;
  }

  location /socket.io/ {
    set $up http://websocket-service:3005;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    set $up http://frontend:3000;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}